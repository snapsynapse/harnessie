name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose attached distributions should be recovered to PyPI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install release dependencies and sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python scripts/dependency_locks.py
          python -m pip install --require-hashes --only-binary=:all: -r requirements/release.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Assert confinement and run exact-tag release gate
        run: |
          python -c "from harness import sandbox; backend = sandbox.backend_name(); assert backend == 'bwrap', backend"
          python scripts/release_gate.py --locked-build
          node scripts/check-search.mjs
      - name: Build final distributions once
        run: |
          python -m build --no-isolation --outdir dist
          python -m twine check dist/*
          python scripts/check_release_artifacts.py dist
          python scripts/fresh_install_smoke.py dist/harnessie-*.whl
      - name: Generate reproducible CycloneDX SBOM and checksums
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p release
          uv venv /tmp/harnessie-release-runtime
          uv pip install --python /tmp/harnessie-release-runtime/bin/python --require-hashes --only-binary=:all: -r requirements/runtime.txt
          uv pip install --python /tmp/harnessie-release-runtime/bin/python --no-deps dist/harnessie-*.whl
          uv pip check --python /tmp/harnessie-release-runtime/bin/python
          cyclonedx-py environment /tmp/harnessie-release-runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --validate \
            --output-file "release/harnessie-$version.cdx.json"
          cyclonedx-py environment /tmp/harnessie-release-runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --validate \
            --output-file /tmp/harnessie-release-sbom-second.json
          cmp "release/harnessie-$version.cdx.json" /tmp/harnessie-release-sbom-second.json
          sha256sum dist/* "release/harnessie-$version.cdx.json" > "release/harnessie-$version.SHA256SUMS"
      - name: Attest the final distributions, SBOM and checksum record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/harnessie-*.whl
            dist/harnessie-*.tar.gz
            release/harnessie-*.cdx.json
            release/harnessie-*.SHA256SUMS
      - name: Verify original build provenance before asset handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release_provenance.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-integrity
          path: release/
          if-no-files-found: error
          retention-days: 7

  attach-release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-integrity
          path: release/
      - name: Attach exact distributions and integrity evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/verify_release_provenance.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" dist/* release/* --repo "$GH_REPO"

  publish-pypi:
    needs: [build, attach-release-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/harnessie/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  recover-release-assets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify exact GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = "false"
          mkdir -p dist release
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "harnessie-$version-py3-none-any.whl" --dir dist
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "harnessie-$version.tar.gz" --dir dist
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "harnessie-$version.cdx.json" --dir release
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "harnessie-$version.SHA256SUMS" --dir release
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python3 scripts/verify_release_provenance.py --tag "$RELEASE_TAG" --commit "$release_commit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-pypi-recovery:
    needs: recover-release-assets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/harnessie/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-python-package-distributions
          path: dist/
      - name: Publish recovered distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
