# Stewardship scorecard: meta checks that keep future-agent state and public
# surfaces aligned with Harnessie's operating posture.
suite: stewardship
description: Current-state quality and public-surface hygiene for agent rotations.
scenarios:
  - id: public_surface_has_no_local_paths
    kind: repo_hygiene
    paths:
      - README.md
      - assistant-guide.txt
      - docs/**/*.md
      - docs/**/*.html
    deny_contains:
      - "file://"
      - "/Users/"
      - "handoffs/"

  - id: next_state_names_release_boundaries_gates_and_verification
    kind: repo_hygiene
    paths:
      - NEXT.md
    require_contains:
      - "Release boundary"
      - "Adoption direction"
      - "Verified evidence"
      - "Release candidate order"
      - "External and optional checks"
      - "python3 -m pytest -q"
      - "python3 -m harness.cli eval"
      - "python3 -m harness.cli verify-manifest"
      - "stable core release"
      - "Current `main` is ahead"
