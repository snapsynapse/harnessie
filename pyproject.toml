[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessie"
version = "1.1.0"
description = "Harnessie: a brain-agnostic multi-agent harness whose Golden Rule, read together and write only what you own, is enforced by ownership lanes, verification gates, consent-based orchestration, containment-aware routing, and tamper-evident audit."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sam Rogers", email = "subscriptions@snapsynapse.com" }]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://harnessie.com/"
Repository = "https://github.com/snapsynapse/harnessie"
Assistant-Guide = "https://harnessie.com/.well-known/assistant-guide.txt"

[project.scripts]
harnessie = "harness.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "twine>=6.0"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.schemas.v1" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
